name: CI

on:
  push:
    branches: [main, personal-os-v1]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aios
          POSTGRES_PASSWORD: aios
          POSTGRES_DB: aios_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aios" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://aios:aios@localhost:5432/aios_test
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      JWT_SECRET: ci-only-jwt-secret-not-a-real-secret-0123456789
      EMAIL_TRANSPORT: memory
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: scripts/ci/audit.sh
      - name: Random token key for this run
        run: echo "TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Build
        run: pnpm build
        env:
          UPSTASH_REDIS_REST_URL: https://example.invalid
          UPSTASH_REDIS_REST_TOKEN: ci-dummy
